<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>授業管理アプリ</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <h1>授業管理アプリ</h1>
        <div class="student-form">
            <label for="student-input">生徒名</label>
            <input id="student-input" type="text" placeholder="生徒名を入力" />
            <button id="add-button" type="button">登録</button>
        </div>

        <div class="student-list-panel">
            <div class="student-list-wrapper">
                <div class="student-list-header">生徒名</div>
                <ul id="student-list"></ul>
            </div>

            <button id="select-button" type="button" class="select-button">選択</button>
        </div>

        <script src="app.js" defer></script>
    </body>
</html>
